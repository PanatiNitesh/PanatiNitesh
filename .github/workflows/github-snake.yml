name: Generate GitHub Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: PanatiNitesh
          outputs: |
            github-snake.svg
            github-snake-dark.svg?palette=github-dark

      - name: Commit generated graph
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "Update GitHub contribution graph"
          file_pattern: "github-snake.svg github-snake-dark.svg"
